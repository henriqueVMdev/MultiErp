name: Publish snapshot

# Manual only: Actions > Publish snapshot > Run workflow. Publishes the current -SNAPSHOT to GitHub Packages.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Writes a settings.xml with a "github" server that reads the token below.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      # deploy runs the full build and tests first; a red build publishes nothing.
      - run: mvn -B deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
